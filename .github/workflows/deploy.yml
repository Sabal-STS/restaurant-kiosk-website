name: Deploy Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The site is plain HTML, CSS and JavaScript. There is no build step:
      # the files in the repo root are exactly what gets served.
      - name: Stage site files
        run: |
          set -e
          mkdir -p site
          cp index.html site/
          cp robots.txt sitemap.xml site.webmanifest site/
          cp google3ae62cd7632ae95d.html site/
          cp -r assets site/
          echo "Staged for deploy:"
          find site -type f | sort

      - name: Upload site to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          source: "site/*"
          target: "/tmp/sts-kiosk-website"
          strip_components: 1

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          script: |
            set -e

            mkdir -p /var/www/html/sts-kiosk-website

            rm -rf /var/www/html/sts-kiosk-website/*

            cp -r /tmp/sts-kiosk-website/* /var/www/html/sts-kiosk-website/

            rm -rf /tmp/sts-kiosk-website

            sudo systemctl reload nginx
